<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recetas de la comarca — Ayamonte.org</title>
  <meta name="description" content="Recetas gastronómicas de Ayamonte y su comarca, con ingredientes, elaboración y origen.">
  <link rel="canonical" href="/recetas">
  <meta name="theme-color" content="#c92a2a">
  <meta property="og:image" content="/assets/icons/favicon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css?v=10">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .recipe-filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .recipe-filters button { padding: .4rem .9rem; border: 1px solid var(--line); background: var(--paper); border-radius: 20px; cursor: pointer; font-size: .85rem; transition: all .2s; }
    .recipe-filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
    .recipe-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .recipe-card img { width: 100%; height: 160px; object-fit: cover; }
    .recipe-card .body { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
    .recipe-card h3 { font-family: var(--serif); margin: 0 0 .3rem; font-size: 1.05rem; }
    .recipe-card .origin { font-size: .78rem; color: var(--ink-mute); margin-bottom: .6rem; }
    .recipe-card .preview { font-size: .88rem; color: var(--ink-soft); flex: 1; }
    .recipe-card .actions { margin-top: .8rem; display: flex; gap: .5rem; }
    .recipe-card .actions button { padding: .35rem .7rem; font-size: .8rem; }
    .recipe-detail { display: none; padding: 0 1rem 1rem; }
    .recipe-detail.open { display: block; }
    .recipe-detail .ingredients, .recipe-detail .steps { margin-top: .6rem; font-size: .9rem; }
    .recipe-detail .steps ol { padding-left: 1.2rem; }
    .load-more { text-align: center; margin-top: 1.5rem; }
  </style>
</head>
<body data-page="recetas" data-section="recetas">

  <header class="topbar" id="topbar"></header>
  <div class="masthead">
    <div class="container masthead-inner">
      <a href="/" aria-label="Ayamonte.org — Portada">
        <span class="logo">Ayamonte<span class="logo-accent">.org</span></span>
        <span class="logo-sub">Periódico digital · Huelva</span>
      </a>
    </div>
  </div>
  <nav class="mainnav" id="mainnav" aria-label="Secciones"></nav>

  <main>
    <div class="container">
      <div class="page-head">
        <div class="breadcrumbs"><a href="/">Portada</a> / Recetas</div>
        <h1>Recetas de la comarca</h1>
        <p>Platos típicos de Ayamonte y su comarca. Aporta la tuya.</p>
      </div>

      <div class="recipe-filters" id="filters"></div>
      <div class="recipe-grid" id="grid"></div>
      <div class="load-more"><button class="btn-a ghost" id="load-more" style="display:none">Ver más recetas</button></div>

      <section class="submit-box">
        <h2>Aporta tu receta</h2>
        <p style="font-size:.9rem;color:var(--ink-mute)">Tu receta será revisada antes de publicarse.</p>
        <form id="submit-form">
          <div style="display:flex;flex-wrap:wrap;gap:.7rem">
            <div class="field" style="flex:1;min-width:200px"><label>Título</label><input type="text" id="s-title" required></div>
            <div class="field" style="flex:1;min-width:200px"><label>Origen (lugar)</label><input type="text" id="s-origin" placeholder="Ayamonte, Isla Cristina..." required></div>
            <div class="field" style="flex-basis:100%"><label>Ingredientes</label><textarea id="s-ingredients" required></textarea></div>
            <div class="field" style="flex-basis:100%"><label>Elaboración</label><textarea id="s-steps" required></textarea></div>
            <div class="field" style="flex:1;min-width:200px"><label>Tu nombre (opcional)</label><input type="text" id="s-source"></div>
            <div class="field" style="justify-content:flex-end"><button class="btn-a accent" type="submit">Enviar receta</button></div>
          </div>
        </form>
        <div id="submit-msg" style="margin-top:.8rem;font-size:.9rem"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/api.js?v=7"></script>
  <script src="/js/main.js?v=7"></script>
  <script>
    (function () {
      const grid = document.getElementById('grid');
      const filtersEl = document.getElementById('filters');
      const loadMoreBtn = document.getElementById('load-more');
      let allRecipes = [];
      let currentFilter = 'Todos';
      let shown = 6;

      function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      function render() {
        const filtered = currentFilter === 'Todos' ? allRecipes : allRecipes.filter((r) => (r.origin || '').toLowerCase().includes(currentFilter.toLowerCase()));
        const toShow = filtered.slice(0, shown);
        grid.innerHTML = toShow.map((r) => {
          const img = r.image_url || '/assets/images/placeholder-sociedad.svg';
          const preview = (r.ingredients || '').split('\n')[0] || '';
          return '<article class="recipe-card">' +
            '<img src="' + esc(img) + '" alt="' + esc(r.title) + '" onerror="this.src=\'/assets/images/placeholder-default.svg\'">' +
            '<div class="body">' +
            '<h3>' + esc(r.title) + '</h3>' +
            '<div class="origin">' + esc(r.origin || '') + (r.source_name ? ' · ' + esc(r.source_name) : '') + '</div>' +
            '<div class="preview">' + esc(preview) + (preview.length < (r.ingredients||'').length ? '…' : '') + '</div>' +
            '<div class="actions">' +
            '<button class="btn-a small" data-id="' + r.id + '">Ver receta</button>' +
            '</div></div>' +
            '<div class="recipe-detail" id="detail-' + r.id + '">' +
            (r.ingredients ? '<div class="ingredients"><strong>Ingredientes:</strong><br>' + esc(r.ingredients).replace(/\n/g, '<br>') + '</div>' : '') +
            (r.steps ? '<div class="steps"><strong>Elaboración:</strong><ol>' + r.steps.split('\n').filter(Boolean).map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol></div>' : '') +
            (r.source_url ? '<div style="margin-top:.6rem"><a href="' + esc(r.source_url) + '" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">Fuente original →</a></div>' : '') +
            '</div></article>';
        }).join('');

        grid.querySelectorAll('[data-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const d = document.getElementById('detail-' + btn.dataset.id);
            if (d) {
              d.classList.toggle('open');
              btn.textContent = d.classList.contains('open') ? 'Ocultar' : 'Ver receta';
            }
          });
        });

        loadMoreBtn.style.display = shown < filtered.length ? 'inline-block' : 'none';
      }

      API.get('/api/recipes?limit=100').then((items) => {
        allRecipes = items || [];
        // Filtros por lugar
        const places = ['Todos'].concat([...new Set(allRecipes.map((r) => (r.origin || '').split('/')[0].trim()).filter(Boolean))].sort());
        filtersEl.innerHTML = places.map((p) => '<button class="' + (p === 'Todos' ? 'active' : '') + '" data-place="' + esc(p) + '">' + esc(p) + '</button>').join('');
        filtersEl.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('click', () => {
            filtersEl.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.place;
            shown = 6;
            render();
          });
        });
        render();
      }).catch((e) => {
        grid.innerHTML = '<div class="empty is-visible">Error: ' + esc(e.message) + '</div>';
      });

      loadMoreBtn.addEventListener('click', () => { shown += 6; render(); });

      document.getElementById('submit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('submit-msg');
        try {
          await API.send('/api/recipes', 'POST', {
            title: document.getElementById('s-title').value.trim(),
            origin: document.getElementById('s-origin').value.trim(),
            ingredients: document.getElementById('s-ingredients').value.trim(),
            steps: document.getElementById('s-steps').value.trim(),
            source_name: document.getElementById('s-source').value.trim() || 'Usuario',
            source_url: ''
          });
          msg.textContent = '¡Gracias! Tu receta ha sido enviada y será revisada antes de publicarse.';
          msg.style.color = 'var(--success)';
          document.getElementById('submit-form').reset();
        } catch (err) {
          msg.textContent = 'Error: ' + err.message;
          msg.style.color = 'var(--accent-red)';
        }
      });
    })();
  </script>
</body>
</html>
