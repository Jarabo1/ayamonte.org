<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recetas de la comarca — Ayamonte.org</title>
  <meta name="description" content="Recetas gastronómicas de Ayamonte y su comarca, con elaboración y origen.">
  <link rel="canonical" href="/recetas">
  <meta name="theme-color" content="#c92a2a">
  <meta property="og:image" content="/assets/icons/favicon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css?v=10">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .recipe-card { background: var(--paper-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.2rem; }
    .recipe-card h3 { font-family: var(--serif); margin: 0 0 .4rem; }
    .recipe-meta { font-size: .8rem; color: var(--ink-mute); margin-bottom: .8rem; }
    .recipe-card .ingredients, .recipe-card .steps { margin-top: .8rem; }
    .recipe-card .steps ol { padding-left: 1.2rem; }
  </style>
</head>
<body data-page="recetas" data-section="recetas">

  <header class="topbar" id="topbar"></header>
  <div class="masthead">
    <div class="container masthead-inner">
      <a href="/" aria-label="Ayamonte.org — Portada">
        <span class="logo">Ayamonte<span class="logo-accent">.org</span></span>
        <span class="logo-sub">Periódico digital · Huelva</span>
      </a>
    </div>
  </div>
  <nav class="mainnav" id="mainnav" aria-label="Secciones"></nav>

  <main>
    <div class="container">
      <div class="page-head">
        <div class="breadcrumbs"><a href="/">Portada</a> / Recetas</div>
        <h1>Recetas de la comarca</h1>
        <p>Platos típicos de Ayamonte y su comarca, con ingredientes, elaboración y origen.</p>
      </div>
      <div id="recipes-list">Cargando recetas…</div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/api.js?v=7"></script>
  <script src="/js/main.js?v=7"></script>
  <script>
    (function () {
      API.get('/api/recipes?limit=50').then((items) => {
        const root = document.getElementById('recipes-list');
        if (!items || !items.length) {
          root.innerHTML = '<div class="empty is-visible">Aún no hay recetas. Se añadirán pronto.</div>';
          return;
        }
        root.innerHTML = items.map((r) => {
          const ing = r.ingredients ? '<div class="ingredients"><strong>Ingredientes:</strong><br>' + esc(r.ingredients).replace(/\n/g, '<br>') + '</div>' : '';
          const steps = r.steps ? '<div class="steps"><strong>Elaboración:</strong><ol>' + r.steps.split('\n').filter(Boolean).map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol></div>' : '';
          const meta = [r.origin, r.source_name].filter(Boolean).map(esc).join(' · ');
          return '<article class="recipe-card"><h3>' + esc(r.title) + '</h3>' +
            (meta ? '<div class="recipe-meta">' + meta + '</div>' : '') +
            ing + steps +
            (r.source_url ? '<div style="margin-top:.8rem"><a href="' + esc(r.source_url) + '" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">Fuente original →</a></div>' : '') +
            '</article>';
        }).join('');
      }).catch((e) => {
        document.getElementById('recipes-list').innerHTML = '<div class="empty is-visible">Error: ' + esc(e.message) + '</div>';
      });
    })();
  </script>
</body>
</html>
